services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Only read when the volume is first created. On a running database the
      # password is changed with ALTER USER, then set here (.env) to match.
      POSTGRES_PASSWORD: ${PUSH_DB_PASSWORD:-postgres}
      POSTGRES_DB: push
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d push"]
      interval: 3s
      retries: 10
    networks:
      default:
        aliases:
          - push-db
      # customer-api's Django admin reads devices and notifications as
      # admin_ro, SELECT only (scripts/admin_read_only_user.sql). Only
      # this db and customer-api's api are on this network; never the app or
      # redis.
      admin-db:
        aliases:
          - push-db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10
    networks:
      default:
        aliases:
          - push-redis

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      # push-db and push-redis, never the short names db and redis: this app
      # also sits on gostyle-net, where other stacks have services called redis.
      # PUSH_DB_PASSWORD in .env: hex only (openssl rand -hex 24), it sits in
      # a URL.
      DATABASE_URL: postgres://postgres:${PUSH_DB_PASSWORD:-postgres}@push-db:5432/push
      FIREBASE_KEY_PATH: /secrets/firebase-service-account.json
      REDIS_HOST: push-redis
      REDIS_PORT: "6379"
    volumes:
      - ./firebase-service-account.json:/secrets/firebase-service-account.json:ro
    ports:
      - "127.0.0.1:3351:3351"
    networks:
      default:
      gostyle:
        aliases:
          - push-app

volumes:
  pgdata:
  redisdata:

networks:
  gostyle:
    external: true
    name: gostyle_gostyle-net
  # Created once by hand, before `docker compose up`:
  #   docker network create --driver overlay --attachable gostyle_admin-db
  admin-db:
    external: true
    name: gostyle_admin-db